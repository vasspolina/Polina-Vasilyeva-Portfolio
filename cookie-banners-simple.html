<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d3d3d3"><title>Cookie banners — keyboard test</title><style>
:root{color-scheme:light;--paper:#d3d3d3;--ink:#111;--pink:#ec3cf1;--data:#a400b1}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:400 14px/1.2 'Helvetica Neue',Helvetica,Arial,sans-serif}button,summary{font:inherit;color:inherit}header{display:flex;justify-content:space-between;gap:24px;padding:28px 32px}header p{margin:0}main{max-width:940px;margin:100px auto 56px;padding:0 32px}h1{font-size:32px;font-weight:400;line-height:1.15;margin:0 0 20px;max-width:24ch}.intro{font-size:20px;line-height:1.3;margin:0 0 48px;max-width:52ch}figure{margin:0;border:1px solid var(--pink);padding:32px 40px 24px;position:relative}.rule{height:1px;background:var(--pink);margin-bottom:12px}.chart-labels{display:flex;justify-content:space-between;gap:16px;font-size:14px;margin:20px 0 12px}.chart-labels .number{display:block;font-size:32px;margin-bottom:6px}.chart-labels .rest{text-align:right;align-self:flex-end}.bar{display:block;width:100%;height:220px;border:1px solid var(--data);padding:0;background:transparent;position:relative;cursor:pointer;text-align:left}.measured{position:absolute;inset:0 auto 0 0;width:20.694%;border-right:1px solid var(--data);background:#a400b109}.measured svg{width:100%;height:100%;display:block;overflow:visible;pointer-events:none}.measured line{stroke:var(--data);stroke-width:1;vector-effect:non-scaling-stroke}.bar:hover .measured{background:#a400b11a}.bar:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:6px}.axis{display:flex;justify-content:space-between;margin:12px 0 24px;font-variant-numeric:tabular-nums}.count{margin:0 0 24px;line-height:1.4}figcaption{border-top:1px solid var(--pink);padding-top:12px;font-size:14px}details{margin-top:24px}summary{min-height:44px;cursor:pointer;padding:12px 0;width:max-content;text-decoration:underline;text-underline-offset:4px}details p{max-width:60ch;margin:8px 0 20px;line-height:1.4}.note{font-size:14px;line-height:1.4;margin-top:40px;max-width:68ch}.sr-only{position:absolute;clip-path:inset(50%);height:1px;width:1px;overflow:hidden;white-space:nowrap}@media(max-width:600px){header{padding:24px;gap:16px}header p:first-child{max-width:20ch}main{margin:48px auto 32px;padding:0 24px}h1{font-size:32px}.intro{margin-bottom:32px}figure{padding:20px 20px 16px}.bar{height:160px}.chart-labels{margin-top:16px}.chart-labels .rest{max-width:10ch}.note{margin-top:28px}}@media(forced-colors:active){figure,.rule{border-color:CanvasText}.bar{border-color:CanvasText}.measured{border-right:2px solid CanvasText}.measured line{stroke:CanvasText}}

/* Full-page composition with a consistent 40px outer margin. */
body{padding:40px;min-height:100svh;display:flex;flex-direction:column}
header{padding:0;flex-wrap:wrap}
main{width:100%;max-width:none;margin:0;padding:64px 0 0;flex:1;display:flex;flex-direction:column}
figure{width:100%;flex:1;display:flex;flex-direction:column;min-height:360px}
.bar{flex:1;min-height:180px;height:auto}
.note{margin-bottom:0}
@media(max-width:600px){body{padding:40px}header{padding:0;gap:16px}main{padding:40px 0 0;margin:0}figure{padding:20px 16px 16px;min-height:320px}.bar{height:auto;min-height:160px}.intro{margin-bottom:32px}}
</style></head><body><header><p>Cookie banners</p><p>27 EU country lists</p></header><main>
<h1>About 1 in 5 cookie banners stayed open.</h1>
<p class="intro">Tested with Tab and Enter.</p>
<figure aria-labelledby="chart-title"><div class="rule" aria-hidden="true"></div><div class="chart-labels" aria-hidden="true"><span><span class="number">20.7%</span>Stayed open</span><span class="rest">Remaining tests</span></div>
<button class="bar" type="button" aria-label="20.7 percent: 1,634 of 7,896 banner tests left the banner open. Show test details." aria-controls="method" aria-expanded="false"><span class="measured" aria-hidden="true"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="0" y1="0" x2="100" y2="100"/><line x1="0" y1="100" x2="100" y2="0"/></svg></span></button>
<div class="axis" aria-hidden="true"><span>0%</span><span>100%</span></div><p class="count" id="chart-title">1,634 of 7,896 banner tests.</p></figure>
<details id="method"><summary>About the test</summary><p>The automated test used Tab and Enter on banners covering the page. Other keys may work.</p></details>
<p class="note">Automated tests, September–October 2026.<br>Websites may appear in several country lists.</p></main><script>const b=document.querySelector('.bar'),d=document.getElementById('method');b.addEventListener('click',()=>{d.open=!d.open;b.setAttribute('aria-expanded',String(d.open))});d.addEventListener('toggle',()=>b.setAttribute('aria-expanded',String(d.open)));</script></body></html>
