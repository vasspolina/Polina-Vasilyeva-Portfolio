<script>
const tip=document.querySelector('.tip'),detail=document.getElementById('detail-text'),rows=[...document.querySelectorAll('.row')];
function line(b){return b.dataset.country+': '+Number(b.dataset.count).toLocaleString('en-US')+' of '+Number(b.dataset.total).toLocaleString('en-US')+' covering banners ('+b.dataset.rate+'%).'}
function show(b,e){tip.replaceChildren();const t=document.createElement('strong');t.textContent=b.dataset.country;const p=document.createElement('span');p.textContent=Number(b.dataset.count).toLocaleString('en-US')+' of '+Number(b.dataset.total).toLocaleString('en-US')+' covering banners · '+b.dataset.rate+'%';tip.append(t,p);tip.hidden=false;const box=b.getBoundingClientRect(),x=e?e.clientX:box.left+box.width/2,y=e?e.clientY:box.bottom;tip.style.left=Math.max(16,Math.min(x+16,innerWidth-tip.offsetWidth-16))+'px';tip.style.top=Math.max(16,Math.min(y+16,innerHeight-tip.offsetHeight-16))+'px';}
for(const b of rows){b.setAttribute('aria-pressed','false');b.addEventListener('mouseenter',e=>show(b,e));b.addEventListener('mouseleave',()=>tip.hidden=true);b.addEventListener('focus',()=>show(b));b.addEventListener('blur',()=>tip.hidden=true);b.addEventListener('click',()=>{rows.forEach(r=>r.setAttribute('aria-pressed',String(r===b)));detail.textContent=line(b);tip.hidden=true})}document.addEventListener('keydown',e=>{if(e.key==='Escape')tip.hidden=true});window.addEventListener('scroll',()=>tip.hidden=true,{passive:true});
